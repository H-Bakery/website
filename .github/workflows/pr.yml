name: Pull Request

# Nur PR-spezifische Checks. Qualitaet, Tests, Builds, E2E und der Security-Audit
# laufen in ci.yml, das bei `pull_request` gegen main/develop ohnehin mitlaeuft -
# hier liefen sie ein zweites Mal, mit eigenen (teils dauerhaft roten) Kopien der
# gleichen Schritte.
on:
  pull_request:
    # `edited` gehoert dazu: die Titelpruefung unten ist das Einzige, was einen
    # umbenannten PR bewertet. Ohne dieses Event bleibt ein korrigierter Titel rot.
    types: [opened, synchronize, reopened, edited]

jobs:
  # Label PR based on changes
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v4
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'

  # Check PR title follows conventional commits
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Final status check
  pr-status:
    needs: [label, pr-title]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "PR checks failed"
            exit 1
          else
            echo "All PR checks passed"
          fi
