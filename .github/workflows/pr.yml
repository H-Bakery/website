name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Label PR based on changes
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  # Check PR title follows conventional commits
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Run quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint:affected -- --base=origin/${{ github.base_ref }}

      - name: Type check
        run: npm run type-check

      - name: Check for console logs
        run: |
          if grep -r "console\.\(log\|error\|warn\|info\)" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist .; then
            echo "Found console statements. Please remove them."
            exit 1
          fi

  # Run tests
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: |
          npx nx affected --target=test \
            --base=origin/${{ github.base_ref }} \
            --parallel=2 \
            --ci \
            --coverage \
            --shard=${{ matrix.shard }}/3

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unit-${{ matrix.shard }}
          fail_ci_if_error: false

  # Build affected projects
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build affected projects
        run: nx affected:build --base=origin/${{ github.base_ref }} --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 5

  # Run E2E tests on affected apps
  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop, management, landing]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if app is affected
        id: check
        run: |
          AFFECTED=$(npx nx show projects --affected --base=origin/${{ github.base_ref }} | grep "bakery-${{ matrix.app }}" || echo "")
          echo "affected=$([[ -n "$AFFECTED" ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check.outputs.affected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.affected == 'true'
        run: npm ci

      - name: Install Playwright
        if: steps.check.outputs.affected == 'true'
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        if: steps.check.outputs.affected == 'true'
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Run E2E tests
        if: steps.check.outputs.affected == 'true'
        run: nx e2e bakery-${{ matrix.app }}-e2e --configuration=ci

      - name: Upload test results
        if: always() && steps.check.outputs.affected == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: playwright-results-${{ matrix.app }}
          path: dist/.playwright/apps/bakery-${{ matrix.app }}-e2e/
          retention-days: 7

  # Bundle size check
  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Analyze bundle size
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: build

  # Security check
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        run: npm audit --production --audit-level=moderate

  # Preview deployment
  preview:
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true

      - name: Comment preview links
        uses: actions/github-script@v6
        with:
          script: |
            const preview_url = '${{ steps.deploy.outputs.preview-url }}';
            const comment = `## 🚀 Preview Deployment
            
            Your changes have been deployed to: ${preview_url}
            
            ### Preview Links:
            - 🛍️ [Shop](${preview_url})
            - 📊 [Management](${preview_url}/admin)
            - 🏠 [Landing](${preview_url}/landing)
            
            ### Test Accounts:
            - **Admin**: admin@example.com / password123
            - **User**: user@example.com / password123
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Final status check
  pr-status:
    needs: [quality, test, build, e2e, bundle-size, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "PR checks failed"
            exit 1
          else
            echo "All PR checks passed"
          fi