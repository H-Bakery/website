name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  HUSKY: 0

jobs:
  # Job to detect what changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      shop: ${{ steps.filter.outputs.shop }}
      management: ${{ steps.filter.outputs.management }}
      landing: ${{ steps.filter.outputs.landing }}
      libs: ${{ steps.filter.outputs.libs }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            shop:
              - 'apps/bakery-shop/**'
              - 'libs/bakery-shop/**'
              - 'libs/shared/**'
            management:
              - 'apps/bakery-management/**'
              - 'libs/bakery-management/**'
              - 'libs/shared/**'
            landing:
              - 'apps/bakery-landing/**'
              - 'libs/shared/**'
            libs:
              - 'libs/**'
            api:
              - 'apps/bakery-api/**'
              - 'libs/shared/**'

  # Lint and type check
  quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check -- --base=origin/main

      - name: Run linting
        run: npm run lint:affected -- --base=origin/main

      - name: Type check
        run: npm run type-check

  # Unit tests
  test-unit:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: |
          npx nx affected --target=test \
            --base=origin/main \
            --parallel=2 \
            --ci \
            --coverage \
            --shard=${{ matrix.shard }}/3

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unit-${{ matrix.shard }}
          fail_ci_if_error: false

  # E2E tests for shop
  test-e2e-shop:
    needs: [changes, quality]
    if: needs.changes.outputs.shop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shop application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-shop --configuration=production

      - name: Run E2E tests
        run: npx nx e2e bakery-shop-e2e --configuration=ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shop
          path: dist/.playwright/apps/bakery-shop-e2e/
          retention-days: 7

  # E2E tests for management
  test-e2e-management:
    needs: [changes, quality]
    if: needs.changes.outputs.management == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build management application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-management --configuration=production

      - name: Run E2E tests
        run: npx nx e2e bakery-management-e2e --configuration=ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-management
          path: dist/.playwright/apps/bakery-management-e2e/
          retention-days: 7

  # E2E tests for landing
  test-e2e-landing:
    needs: [changes, quality]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build landing application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-landing --configuration=production

      - name: Run E2E tests
        run: npx nx e2e bakery-landing-e2e --configuration=ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-landing
          path: dist/.playwright/apps/bakery-landing-e2e/
          retention-days: 7

  # Build applications
  build:
    # Bewusst nicht an test-unit gehaengt: ob eine App ueberhaupt baut, ist von
    # fehlschlagenden Tests unabhaengig. Solange build hinter test-unit haengt,
    # verdeckt jeder rote Test den Build-Status komplett (er wird uebersprungen) -
    # genau so blieb der kaputte Projektgraph unbemerkt. ci-status aggregiert
    # weiterhin beides, das Gesamturteil des PR aendert sich also nicht.
    needs: [quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bakery-shop, bakery-management, bakery-landing, bakery-api]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        env:
          # withNx() creates a *nested* Nx project graph from inside `next build`.
          # With plugins isolated in worker processes that crashes the IPC layer
          # ("Could not create project graph"), which is what kept every Next app
          # build red. Running the graph plugins in-process avoids it.
          NX_ISOLATE_PLUGINS: 'false'
          # In-process plugins have a side effect on a cold graph cache (every CI
          # run): @nx/vite/plugin calls Vite's resolveConfig(), which sets
          # process.env.NODE_ENV=development in the Nx process when it is unset.
          # `next build` inherits that, compiles against development React and
          # dies in prerender with "Cannot read properties of null (reading
          # 'useState')". Pin the production value so the leak cannot reach it.
          NODE_ENV: production
        run: npx nx build ${{ matrix.app }} --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          # bakery-landing is a static export and lands in the project dir, not dist/.
          path: |
            dist/apps/${{ matrix.app }}/
            apps/${{ matrix.app }}/out/
          # The Next.js build lives in a hidden `.next/` directory, which
          # upload-artifact@v4 drops by default - the artifact would hold only
          # next.config.js, package.json and public/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Bundle size analysis
  bundle-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shop build
        uses: actions/download-artifact@v4
        with:
          name: build-bakery-shop
          # The build job uploads two paths, so upload-artifact roots the
          # archive at the workspace root: it already contains
          # dist/apps/bakery-shop/... - unpack it in place.
          path: .

      # Lighthouse needs a running server; nothing else in this job starts one.
      - name: Serve shop build
        run: |
          NODE_ENV=production npx next start dist/apps/bakery-shop -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000

      - name: Analyze bundle size
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Security audit
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Der Audit meldet Altlasten im Abhaengigkeitsbaum und wuerde den Job
      # sonst immer roeten, bevor Trivy ueberhaupt laeuft.
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      - name: Run security scan
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Final status check
  ci-status:
    needs:
      [
        quality,
        test-unit,
        test-e2e-shop,
        test-e2e-management,
        test-e2e-landing,
        build,
        security,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "CI Failed"
            exit 1
          else
            echo "CI Passed"
          fi
