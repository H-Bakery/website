name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  HUSKY: 0

jobs:
  # Job to detect what changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      shop: ${{ steps.filter.outputs.shop }}
      management: ${{ steps.filter.outputs.management }}
      landing: ${{ steps.filter.outputs.landing }}
      digitale-baeckerei: ${{ steps.filter.outputs.digitale-baeckerei }}
      libs: ${{ steps.filter.outputs.libs }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            # Die E2E-Suiten, ihr gemeinsames Werkzeug (tools/e2e) und dieser
            # Workflow zaehlen mit - sonst laeuft eine geaenderte Suite erst,
            # wenn zufaellig auch die App angefasst wird.
            # package-lock.json zaehlt ueberall mit: ein Abhaengigkeits-Update
            # (Next, Express, sqlite3 ...) aendert das Verhalten aller Apps, auch
            # wenn kein Quelltext angefasst wird.
            shop:
              - 'apps/bakery-shop/**'
              - 'apps/bakery-shop-e2e/**'
              - 'libs/bakery-shop/**'
              - 'libs/shared/**'
              # Seit B12 faehrt auch die Shop-Suite gegen die echte API.
              - 'apps/bakery-api/**'
              - 'tools/e2e/**'
              - '.github/workflows/ci.yml'
              - 'package-lock.json'
            management:
              - 'apps/bakery-management/**'
              - 'apps/bakery-management-e2e/**'
              - 'libs/bakery-management/**'
              - 'libs/shared/**'
              # Die Management-Suite faehrt seit F4 gegen die echte API.
              - 'apps/bakery-api/**'
              - 'tools/e2e/**'
              - '.github/workflows/ci.yml'
              - 'package-lock.json'
            landing:
              - 'apps/bakery-landing/**'
              - 'apps/bakery-landing-e2e/**'
              - 'libs/shared/**'
              - 'tools/e2e/**'
              - '.github/workflows/ci.yml'
              - 'package-lock.json'
            # Die Digitale Baeckerei hat keine API; von den Libs nutzt nur ihr
            # Build-Skript sync-products den hq-Produktleser.
            digitale-baeckerei:
              - 'apps/bakery-digitale-baeckerei/**'
              - 'apps/bakery-digitale-baeckerei-e2e/**'
              - 'libs/shared/hq-products/**'
              - 'tools/e2e/**'
              - '.github/workflows/ci.yml'
              - 'package-lock.json'
            libs:
              - 'libs/**'
            api:
              - 'apps/bakery-api/**'
              - 'libs/shared/**'
              - 'package-lock.json'

  # Lint and type check
  quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check -- --base=origin/main

      - name: Run linting
        run: npm run lint:affected -- --base=origin/main

      - name: Type check
        run: npm run type-check

  # Unit tests
  test-unit:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        # Schaltet die Coverage-Schwellen ab: ein Shard fuehrt nur einen Teil
        # der Testdateien aus, rechnet die Abdeckung aber ueber alle Quellen -
        # die Schwelle koennte er gar nicht erreichen. Gemessen wird weiter,
        # Codecov setzt die drei Teile zusammen.
        env:
          JEST_SHARDED: 'true'
        run: |
          npx nx affected --target=test \
            --base=origin/main \
            --parallel=2 \
            --ci \
            --coverage \
            --shard=${{ matrix.shard }}/3

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unit-${{ matrix.shard }}
          fail_ci_if_error: false

  # E2E tests for shop
  test-e2e-shop:
    needs: [changes, quality]
    if: needs.changes.outputs.shop == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.54 has no chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shop application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-shop --configuration=production

      # Die echte API (esbuild-Bundle) - tools/e2e/real-api.js startet es (B12).
      - name: Build API bundle
        run: npx nx run bakery-api:bundle

      # Playwright startet die Server selbst (tools/e2e/servers.js, CI=true):
      # `next start` auf dem Build oben und die echte API mit oeffentlichem
      # Katalog (PUBLIC_CATALOGUE=1, frische SQLite-Datenbank) auf dem
      # synthetischen Produktkatalog tools/e2e/hq-products. Das private
      # hq-Repo ist hier nicht ausgecheckt; ohne den Katalog haette der Shop
      # 0 Produkte und jede Zaehl-Assertion waere rot.
      - name: Run E2E tests
        run: npx nx e2e bakery-shop-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shop
          path: dist/.playwright/apps/bakery-shop-e2e/
          retention-days: 7

  # E2E tests for management
  test-e2e-management:
    needs: [changes, quality]
    if: needs.changes.outputs.management == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.54 has no chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build management application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
          # Wie auf der Box (F2): NEXT_PUBLIC_* wirken nur beim Build.
          NEXT_PUBLIC_PILOT_MODE: '1'
        run: npx nx build bakery-management --configuration=production

      # Die echte API (esbuild-Bundle) - tools/e2e/real-api.js startet es.
      - name: Build API bundle
        run: npx nx run bakery-api:bundle

      # Server startet Playwright selbst (tools/e2e/servers.js, CI=true):
      # `next start` auf dem Build und die echte API mit frischer SQLite-
      # Datenbank, beide auf einem synthetischen hq (tools/e2e/hq-products
      # plus erfundene Kassenberichte/Finanzen, prepareE2eHq()).
      - name: Run E2E tests
        run: npx nx e2e bakery-management-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-management
          path: dist/.playwright/apps/bakery-management-e2e/
          retention-days: 7

  # E2E tests for landing
  test-e2e-landing:
    needs: [changes, quality]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.54 has no chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build landing application
        env:
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-landing --configuration=production

      # Der statische Export in apps/bakery-landing/out ist genau das, was nach
      # GitHub Pages geht - ohne hq, mit dem gebuendelten Produkt-Fallback.
      # tools/e2e/serve-static.js liefert ihn wie Pages aus (`/about` ->
      # about.html, Unbekanntes -> 404.html mit Status 404).
      - name: Run E2E tests
        run: npx nx e2e bakery-landing-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-landing
          path: dist/.playwright/apps/bakery-landing-e2e/
          retention-days: 7

  # E2E tests for the Digitale Baeckerei (3D shop)
  test-e2e-digitale-baeckerei:
    needs: [changes, quality]
    if: needs.changes.outputs.digitale-baeckerei == 'true'
    # Dieser Job liest nur: auschecken, bauen, testen, Artefakt hochladen.
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # Playwright 1.54 has no chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Mit DIGITALE_BAECKEREI_FIXTURE=1 nehmen sync-model und sync-products das
      # synthetische Mini-Modell und den synthetischen Produkt-Snapshot aus
      # apps/bakery-digitale-baeckerei/src/test/fixtures - kein Download, kein
      # hq, nie das echte Modell. Gebaut wird fuer den Unterpfad, unter dem die
      # App spaeter auf der Pages-Seite liegt.
      - name: Build Digitale Baeckerei with the synthetic fixture
        env:
          DIGITALE_BAECKEREI_FIXTURE: '1'
          DIGITALE_BAECKEREI_BASE_PATH: /digitale-baeckerei
          # Same pair as in the build job below, for the same two reasons.
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
        run: npx nx build bakery-digitale-baeckerei

      # Playwright startet apps/bakery-digitale-baeckerei-e2e/serve-fixture.js
      # (tools/e2e/servers.js; CI=true: nimmt den Export von eben). Der Server weigert sich, wenn im
      # Export nicht Fixture-Modell und Fixture-Snapshot liegen - die Artefakte
      # unten sind oeffentlich. WebGL laeuft ueber SwiftShader (playwright.config.ts).
      - name: Run E2E tests
        run: npx nx e2e bakery-digitale-baeckerei-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-digitale-baeckerei
          path: dist/.playwright/apps/bakery-digitale-baeckerei-e2e/
          retention-days: 7

  # Build applications
  build:
    # Bewusst nicht an test-unit gehaengt: ob eine App ueberhaupt baut, ist von
    # fehlschlagenden Tests unabhaengig. Solange build hinter test-unit haengt,
    # verdeckt jeder rote Test den Build-Status komplett (er wird uebersprungen) -
    # genau so blieb der kaputte Projektgraph unbemerkt. ci-status aggregiert
    # weiterhin beides, das Gesamturteil des PR aendert sich also nicht.
    needs: [quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bakery-digitale-baeckerei baut hier mit DIGITALE_BAECKEREI_FIXTURE=1
        # (siehe env unten): synthetisches Mini-Modell und synthetischer
        # Produkt-Snapshot aus dem Repo. Das echte Modell (oeffentlicher
        # Download am festen Commit aus model.lock.json) und das private hq
        # kommen in CI nie ins Spiel - der Export wird als Artefakt hochgeladen.
        app:
          [
            bakery-shop,
            bakery-management,
            bakery-landing,
            bakery-partybrezel,
            bakery-digitale-baeckerei,
            bakery-api,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        env:
          # withNx() creates a *nested* Nx project graph from inside `next build`.
          # With plugins isolated in worker processes that crashes the IPC layer
          # ("Could not create project graph"), which is what kept every Next app
          # build red. Running the graph plugins in-process avoids it.
          NX_ISOLATE_PLUGINS: 'false'
          # In-process plugins have a side effect on a cold graph cache (every CI
          # run): @nx/vite/plugin calls Vite's resolveConfig(), which sets
          # process.env.NODE_ENV=development in the Nx process when it is unset.
          # `next build` inherits that, compiles against development React and
          # dies in prerender with "Cannot read properties of null (reading
          # 'useState')". Pin the production value so the leak cannot reach it.
          NODE_ENV: production
          # Digitale Baeckerei: CI hat kein hq und braucht das echte Modell nicht -
          # synthetisches GLB + Snapshot aus src/test/fixtures (kein Download).
          # Nur diese App liest die Variable.
          DIGITALE_BAECKEREI_FIXTURE: '1'
        run: npx nx build ${{ matrix.app }} --configuration=production

      # Der Export dieser App wird gleich als oeffentliches Artefakt
      # hochgeladen. Er muss das synthetische Fixture enthalten, Byte fuer Byte -
      # nie das echte Modell oder echte Produkttexte (z. B. aus einem Cache).
      # sync-model nimmt auch aus dem Fixture die Preisschilder heraus; verglichen
      # wird darum mit dem bereinigten Fixture (exportFehler in fixture-info.js,
      # dieselbe Pruefung wie im e2e-Server).
      - name: Guard - Digitale Baeckerei export contains only the fixture
        if: matrix.app == 'bakery-digitale-baeckerei'
        run: |
          node -e "
            const { exportFehler } = require('./apps/bakery-digitale-baeckerei/src/test/fixtures/fixture-info')
            const fehler = exportFehler('apps/bakery-digitale-baeckerei/out')
            if (fehler) { console.error(fehler); process.exit(1) }
            console.log('Export enthaelt nur die synthetischen Fixtures.')
          "

      # Boot smoke of the pilot API (roadmap B1): the bundle from the step
      # above starts in production mode on a fresh SQLite file, /health must
      # answer with the database ok, and a restart must not re-run migrations.
      # Auth (B3): the smoke creates an account with the bundled create-user
      # CLI (random password per run), logs in, and checks the global guard
      # (401 without a session, 200 with one). There is no default account.
      - name: Boot smoke bakery-api
        if: matrix.app == 'bakery-api'
        env:
          SMOKE_SKIP_BUNDLE: '1'
        run: apps/bakery-api/scripts/boot-smoke.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          # bakery-landing is a static export and lands in the project dir, not dist/.
          path: |
            dist/apps/${{ matrix.app }}/
            apps/${{ matrix.app }}/out/
          # The Next.js build lives in a hidden `.next/` directory, which
          # upload-artifact@v4 drops by default - the artifact would hold only
          # next.config.js, package.json and public/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Bundle size analysis
  bundle-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shop build
        uses: actions/download-artifact@v4
        with:
          name: build-bakery-shop
          # The build job uploads two paths, so upload-artifact roots the
          # archive at the workspace root: it already contains
          # dist/apps/bakery-shop/... - unpack it in place.
          path: .

      # Lighthouse needs a running server; nothing else in this job starts one.
      - name: Serve shop build
        run: |
          NODE_ENV=production npx next start dist/apps/bakery-shop -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000

      - name: Analyze bundle size
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Security audit
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Der Audit meldet Altlasten im Abhaengigkeitsbaum und wuerde den Job
      # sonst immer roeten, bevor Trivy ueberhaupt laeuft.
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      - name: Run security scan
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Final status check
  ci-status:
    needs:
      [
        quality,
        test-unit,
        test-e2e-shop,
        test-e2e-management,
        test-e2e-landing,
        test-e2e-digitale-baeckerei,
        build,
        security,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "CI Failed"
            exit 1
          else
            echo "CI Passed"
          fi
