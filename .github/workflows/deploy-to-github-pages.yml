name: Deploy to GitHub Pages

# Veröffentlicht die Landingpage und - unter /digitale-baeckerei/ - die Digitale
# Bäckerei. Ablauf, Wächter und die Anleitung für das Secret:
# docs/apps/digitale-baeckerei.md (Abschnitte "Deploy" und "Anleitung:
# hq-Lesezugriff für den Deploy").
#
# Nur diese beiden Auslöser. Das Secret HQ_DEPLOY_KEY darf nie in einen
# Workflow, der auf pull_request oder pull_request_target läuft.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Das Environment hält das Secret HQ_DEPLOY_KEY und ist auf den Branch main
    # beschränkt (Settings → Environments → pages-deploy). Ein Lauf von einem
    # anderen Branch (workflow_dispatch) bekommt das Secret damit nicht.
    environment: pages-deploy
    steps:
      # Ohne Lesezugriff auf hq gibt es keine Digitale Bäckerei - und eine Seite
      # ohne den Unterpfad wird nicht mehr veröffentlicht. Darum als Erstes und
      # mit klarer Meldung abbrechen, statt später im Build zu scheitern.
      - name: hq-Lesezugriff vorhanden?
        env:
          HQ_DEPLOY_KEY: ${{ secrets.HQ_DEPLOY_KEY }}
        run: |
          if [ -z "$HQ_DEPLOY_KEY" ]; then
            echo "::error title=Secret HQ_DEPLOY_KEY fehlt::Das Secret HQ_DEPLOY_KEY fehlt oder ist leer. Ohne Lesezugriff auf hq/products kann die Digitale Bäckerei nicht gebaut werden; es wird nichts veröffentlicht, die Seite bleibt, wie sie ist. Anleitung: docs/apps/digitale-baeckerei.md, Abschnitt 'Anleitung: hq-Lesezugriff für den Deploy'. Das Secret gehört in das Environment 'pages-deploy' (nur Branch main) - läuft dieser Workflow von einem anderen Branch, bekommt er es nicht."
            exit 1
          fi
          echo "Secret HQ_DEPLOY_KEY ist gesetzt."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # hq ist privat. Geholt werden nur die Ordner products/ und produkte-3d/
      # (kein Cone-Modus, also auch keine Dateien aus der Wurzel), nur der
      # letzte Stand, mit einem Deploy-Key, der nur lesen darf. Der Schlüssel
      # bleibt nicht auf der Maschine liegen (persist-credentials: false).
      # produkte-3d/ ist der Export des Daten-Repos (Modelle und gerenderte
      # Bilder einzelner Produkte, vom Inhaber am 2026-11-13 freigegeben).
      - name: Checkout hq (nur products/ und produkte-3d/, nur lesend)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: H-Bakery/hq
          ssh-key: ${{ secrets.HQ_DEPLOY_KEY }}
          path: hq
          sparse-checkout: |
            /products/
            /produkte-3d/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # Nur zählen, nie Inhalte ausgeben: Die Logs dieses Repos sind öffentlich.
      - name: hq - nur products/ und produkte-3d/ ausgecheckt?
        run: |
          set -euo pipefail
          fremd=$(find hq -mindepth 1 -maxdepth 1 ! -name .git ! -name products ! -name produkte-3d | wc -l | tr -d ' ')
          if [ "$fremd" -ne 0 ]; then
            echo "::error::In hq/ liegt mehr als products/ und produkte-3d/ ($fremd weitere Einträge) - der Checkout ist nicht darauf beschränkt."
            exit 1
          fi
          if [ ! -f hq/produkte-3d/STAND.json ] || [ ! -f hq/produkte-3d/manifest.json ]; then
            echo "::error::hq/produkte-3d ist kein Export des Daten-Repos (STAND.json oder manifest.json fehlt)."
            exit 1
          fi
          anzahl=$(find hq/products -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          if [ "$anzahl" -eq 0 ]; then
            echo "::error::hq/products enthält keine Produktdateien."
            exit 1
          fi
          echo "hq/products: $anzahl Produktdateien."

      # Die Landingpage baut aus den echten Produkten in hq/products (Namen,
      # Texte, Preise - vom Inhaber am 2026-11-13 freigegeben) und zeigt für
      # Produkte ohne Foto das aus dem 3D-Modell gerenderte Bild (DB13):
      # sync-produktbilder liest den Export hq/produkte-3d am Commit aus
      # produkte-3d-bilder.lock.json und bricht bei einem anderen Stand ab.
      - name: Build landing page
        env:
          NX_DAEMON: 'false'
          NX_STANDALONE_BUILD: '1'
          HQ_PRODUCTS_DIR: ${{ github.workspace }}/hq/products
          PRODUKTE_3D_DIR: ${{ github.workspace }}/hq/produkte-3d
        run: NODE_ENV=production npx nx build-static-standalone bakery-landing

      # Fällt die Landingpage still auf die gebündelten Beispielprodukte oder
      # auf "keine Bilder" zurück, wird nichts veröffentlicht. Nur Zahlen.
      - name: Wächter - Landingpage mit echten Produkten und Bildern
        run: |
          set -euo pipefail
          produkte=$(find hq/products -maxdepth 1 -name '*.md' ! -name '_*' | wc -l | tr -d ' ')
          seiten=$(find apps/bakery-landing/out/products -mindepth 1 -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')
          bilder=$(find apps/bakery-landing/out/produkte-3d/bilder -name '*.webp' 2>/dev/null | wc -l | tr -d ' ')
          echo "hq-Produkte: $produkte, Produktseiten: $seiten, gerenderte Bilder: $bilder"
          if [ "$seiten" -lt 1 ] || [ "$seiten" -gt "$produkte" ]; then
            echo "::error::Die Landingpage hat $seiten Produktseiten bei $produkte Produkten in hq - sie ist nicht aus hq gebaut."
            exit 1
          fi
          if [ "$bilder" -eq 0 ]; then
            echo "::error::Die Landingpage enthält keine gerenderten Produktbilder."
            exit 1
          fi

      # Kein Fixture-Build auf der öffentlichen Seite: Mit dieser Variable nähmen
      # die Sync-Skripte das Test-Modell und erfundene Produkte.
      - name: Kein Fixture-Modus
        run: |
          if [ -n "${DIGITALE_BAECKEREI_FIXTURE:-}" ]; then
            echo "::error::DIGITALE_BAECKEREI_FIXTURE ist gesetzt - die Digitale Bäckerei wird für die öffentliche Seite nie mit dem Test-Modell gebaut."
            exit 1
          fi

      # sync-model lädt das Modell am festen Commit, prüft es und nimmt die
      # Preisschilder heraus; sync-products schreibt den Snapshot ohne Preise aus
      # hq/products und bricht ohne hq ab (keine Mocks); sync-produkte-3d holt
      # die Modelle der ausgelegten Produkte aus dem Export hq/produkte-3d am
      # Commit aus produkte-3d.lock.json. Nie aus dem Nx-Cache.
      - name: Build Digitale Bäckerei
        env:
          NX_DAEMON: 'false'
          NX_ISOLATE_PLUGINS: 'false'
          NODE_ENV: production
          HQ_PRODUCTS_DIR: ${{ github.workspace }}/hq/products
          PRODUKTE_3D_DIR: ${{ github.workspace }}/hq/produkte-3d
          DIGITALE_BAECKEREI_BASE_PATH: /digitale-baeckerei
        run: npx nx build bakery-digitale-baeckerei --skip-nx-cache

      # Bricht ab, wenn der Export nicht genau das ist, was raus darf: das Modell
      # aus dem Lock (ausgeliefert.sha256, ohne Preisschilder), der Snapshot nur
      # mit den erlaubten Feldern, nirgends ein Euro-Zeichen, kein Fixture; die
      # 3D-Modelle einzelner Produkte passen zum Index und gehören zu Produkten,
      # die in einem Raum liegen. Meldet nur Dateinamen und Zahlen.
      - name: Wächter - Export der Digitalen Bäckerei
        run: |
          set -euo pipefail
          node apps/bakery-digitale-baeckerei/scripts/pruefe-export.mjs --base-path /digitale-baeckerei --mit-produkte-3d
          if [ ! -f apps/bakery-digitale-baeckerei/out/produkte-3d/_regal.glb ]; then
            echo "::error::Im Export fehlen die Regal-Modelle (produkte-3d/_regal.glb) - der Export hq/produkte-3d wurde nicht gelesen."
            exit 1
          fi

      # hq wird ab hier nicht mehr gebraucht - weg damit, bevor der Schritt läuft,
      # der veröffentlicht.
      - name: hq-Checkout entfernen
        run: rm -rf hq

      - name: Digitale Bäckerei unter /digitale-baeckerei/ einhängen
        run: |
          set -euo pipefail
          ziel=apps/bakery-landing/out/digitale-baeckerei
          if [ -e "$ziel" ]; then
            echo "::error::$ziel gibt es schon - die Landingpage hat selbst einen Pfad /digitale-baeckerei."
            exit 1
          fi
          cp -R apps/bakery-digitale-baeckerei/out "$ziel"
          test -f apps/bakery-landing/out/index.html
          test -f "$ziel/index.html"
          test -f "$ziel/model/twin.glb"

      - name: Prepare for GitHub Pages
        run: |
          touch apps/bakery-landing/out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/bakery-landing/out
          cname: xn--bckerei-heusser-0kb.de
