<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Building -->
  <rect x="100" y="150" width="400" height="200" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Roof -->
  <polygon points="50,150 300,50 550,150" fill="#654321"/>
  
  <!-- Door -->
  <rect x="250" y="220" width="100" height="130" fill="#4A4A4A"/>
  <circle cx="330" cy="285" r="5" fill="#FFD700"/>
  
  <!-- Windows -->
  <rect x="150" y="200" width="60" height="60" fill="#87CEEB" stroke="#4A4A4A" stroke-width="2"/>
  <rect x="390" y="200" width="60" height="60" fill="#87CEEB" stroke="#4A4A4A" stroke-width="2"/>
  
  <!-- Sign -->
  <rect x="200" y="100" width="200" height="40" fill="#D038BA" stroke="#4A4A4A" stroke-width="2"/>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    Bäckerei Heusser
  </text>
  
  <!-- Ground -->
  <rect x="0" y="350" width="600" height="50" fill="#696969"/>
</svg>