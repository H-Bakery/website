<!DOCTYPE html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#272727" />
    <title>Keine Verbindung – Heusser Verwaltung</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      Offline-Seite der Heusser Verwaltung (F3). Der Service Worker (/sw.js)
      zeigt sie, wenn ein Seitenaufruf den Server nicht erreicht. Sie lädt
      nichts nach (keine Next-Chunks, keine Webfonts) - alles steht hier.
      Das Design folgt dem gespeicherten Modus der App (Standard: dunkel).
    -->
    <script>
      try {
        var stored = JSON.parse(
          localStorage.getItem('bakery-management-theme') || '{}'
        )
        var mode = stored && stored.mode
        if (mode === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
        }
        if (mode === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#1976d2')
        }
      } catch (e) {
        /* ohne Speicher bleibt es dunkel */
      }
    </script>
    <style>
      :root {
        --bg: #121212;
        --paper: #1e1e1e;
        --text: rgba(255, 255, 255, 1);
        --muted: rgba(255, 255, 255, 0.7);
        --accent: #90caf9;
        --accent-text: rgba(0, 0, 0, 0.87);
        --border: rgba(255, 255, 255, 0.12);
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --bg: #ffffff;
        --paper: #ffffff;
        --text: rgba(0, 0, 0, 0.87);
        --muted: rgba(0, 0, 0, 0.6);
        --accent: #1976d2;
        --accent-text: #ffffff;
        --border: rgba(0, 0, 0, 0.12);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--paper);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        min-height: 48px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Keine Verbindung zum Server – bitte WLAN prüfen</h1>
      <p>
        Die Heusser Verwaltung läuft nur im WLAN der Bäckerei. Sobald die
        Verbindung wieder steht, einfach neu laden.
      </p>
      <button type="button" onclick="window.location.reload()">
        Erneut versuchen
      </button>
    </main>
  </body>
</html>
