version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bakery-postgres
    environment:
      POSTGRES_DB: bakery_db
      POSTGRES_USER: bakery_user
      POSTGRES_PASSWORD: bakery_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery_user -d bakery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bakery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bakery-network

  # Backend API
  bakery-api:
    build:
      context: ./apps/bakery-api
      dockerfile: Dockerfile
    container_name: bakery-api
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://bakery_user:bakery_password@postgres:5432/bakery_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_here
      CORS_ORIGIN: http://localhost:4200,http://localhost:4201,http://localhost:4202
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/bakery-api:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # Landing Page
  bakery-landing:
    build:
      context: ./apps/bakery-landing
      dockerfile: Dockerfile
    container_name: bakery-landing
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - bakery-api
    volumes:
      - ./apps/bakery-landing:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bakery-network

  # Shop Application
  bakery-shop:
    build:
      context: ./apps/bakery-shop
      dockerfile: Dockerfile
    container_name: bakery-shop
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001
      PORT: 4201
    ports:
      - "4201:4201"
    depends_on:
      - bakery-api
    volumes:
      - ./apps/bakery-shop:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bakery-network

  # Management System
  bakery-management:
    build:
      context: ./apps/bakery-management
      dockerfile: Dockerfile
    container_name: bakery-management
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001
      PORT: 4202
    ports:
      - "4202:4202"
    depends_on:
      - bakery-api
    volumes:
      - ./apps/bakery-management:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bakery-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bakery-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bakery-api
      - bakery-landing
      - bakery-shop
      - bakery-management
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bakery-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bakery.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bakery-network
    profiles:
      - tools

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bakery-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - bakery-network
    profiles:
      - tools

volumes:
  postgres-data:
  redis-data:

networks:
  bakery-network:
    driver: bridge